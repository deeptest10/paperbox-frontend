<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мій профіль - PaperBox</title>
    <link rel="stylesheet" href="styles.css">
    <script src="auth.js" defer></script>
    <script src="profile.js" defer></script>
</head>
<body>
    <header>
        <h1>PaperBox</h1>
        <a href="index.html">До каталогу</a>
    </header>

    <main>
        <h2>Мій профіль</h2>
        <p id="profile-status" role="status">Завантаження профілю...</p>

        <div id="profile" hidden>
            <p>Ім’я користувача: <strong id="profile-username"></strong></p>
            <p>Електронна пошта: <span id="profile-email"></span></p>
            <button id="logout" type="button">Вийти</button>
        </div>
    </main>
</body>
</html>
